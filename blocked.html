<!DOCTYPE html>
<html id="lbBlockingPage" lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Focus Session Active</title>
  <link rel="shortcut icon" href="/icons/leechblock32.ico" type="image/x-icon">
  <link rel="icon" href="/icons/leechblock32.ico" type="image/x-icon">
  <link rel="stylesheet" href="/style.css" type="text/css">
  <link id="themeLink" rel="stylesheet">
  <style id="customStyle"></style>
</head>
<body>
  <!-- Brand Header -->
  <div class="block-icon-wrap">
    <svg width="42" height="42" viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="12" r="7" stroke="#ef4444" stroke-width="2.5"/>
      <circle cx="12" cy="12" r="2.5" fill="#ef4444"/>
    </svg>
  </div>

  <div id="lbWarningMsgDiv">
    <h1>Focus Session in Progress</h1>
    <p class="subtitle">This website is blocked to help you stay in the flow.</p>
  </div>

  <!-- Blocked site info -->
  <div id="lbBlockedDiv">
    <div id="lbBlockedURLLink"><span id="lbBlockedURL"></span></div>
    <span id="lbBlockedSet">Focus List</span>
    <p id="lbKeywordMatched" style="display: none;">Keyword matched: <span id="lbKeywordMatch" class="keyword"></span></p>
    <p id="lbUnblockText">Session completes at: <span id="lbUnblockTime" class="time">the end of session</span></p>
  </div>

  <!-- Custom message (optional) -->
  <div id="lbCustomMsgDiv" style="display: none;">
    <p class="custom-msg-label">A reminder to yourself:</p>
    <blockquote id="lbCustomMsg"></blockquote>
  </div>

  <!-- Action button -->
  <div class="actions-div">
    <button id="closeTabBtn" class="btn btn-primary" type="button">Close Tab</button>
  </div>

  <script src="/blocked.js"></script>
  <script>
    document.getElementById("closeTabBtn").addEventListener("click", () => {
      browser.runtime.sendMessage({ type: "close" });
    });
  </script>
</body>
</html>
